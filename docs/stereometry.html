  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e141b; --surface: #16202a; --ink: #e5ecf4; --muted: #92a3b5;

<script>
(function () {
  "use strict";

  /* ---------- Форматирование и общие помощники ---------- */
  const fmt = (n) => {
    if (typeof n !== "number") return String(n);
    if (!isFinite(n)) return "∞";
    if (n === 0) return "0";
    const a = Math.abs(n);
    if (a >= 1e6 || a < 1e-3) {
      const [m, e] = n.toExponential(3).split("e");
      return Number(m) + "·10^" + Number(e);
    }
    const prec = Math.max(4, Math.floor(Math.log10(a)) + 1);
    return String(Number(n.toPrecision(prec))).replace("-", "−");
  };
  const par = (n) => (n < 0 ? "(" + fmt(n) + ")" : fmt(n));
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const html = (s) => esc(s).replace(/10\^(-?\d+)/g, "10<sup>$1</sup>");
  const S = (f, c) => ({ f, c });          // шаг: формула + подстановка
  const N = (t) => ({ t });                // текстовый шаг
  const A = (sym, val, unit) => [sym, val, unit || ""];
  const fail = (m) => { throw new Error(m); };
  const isInt = Number.isInteger;
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; };
  const sum = (a) => a.reduce((s, v) => s + v, 0);
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const near = (a, b, e) => Math.abs(a - b) < (e === undefined ? 1e-9 : e);
  const snap = (v) => { const r = Math.round(v); return Math.abs(v - r) < 1e-9 ? r : Number(v.toFixed(9)); };
  const mn = (s) => String(s).replace(/-/g, "−");
  const rus = (n, one, few, many) => {
    const a = Math.abs(n) % 100, b = a % 10;
    return a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many;
  };

  /* Безопасное вычисление выражений: числа, + − * / ^, скобки, √, π (например 5π/6, √3/2, 1/4). */
  function evalExpr(src) {
    const t = String(src).toLowerCase().replace(/,/g, ".").replace(/[\s ]+/g, "").replace(/[−–—]/g, "-").replace(/×|·/g, "*").replace(/÷/g, "/");
    if (!t) return NaN;
    const toks = [];
    const re = /(\d+\.?\d*|\.\d+)|(π|pi)|(√|sqrt)|([-+*\/^()])/g;
    let m, last = 0;
    while ((m = re.exec(t))) {
      if (m.index !== last) return NaN;
      last = re.lastIndex;
      toks.push(m[1] !== undefined ? { n: Number(m[1]) } : m[2] ? { n: Math.PI } : m[3] ? { r: 1 } : { o: m[4] });
    }
    if (last !== t.length || !toks.length) return NaN;
    let i = 0;
    const peek = () => toks[i];
    const startsAtom = (k) => k && (k.n !== undefined || k.r || k.o === "(");
    function expr() {
      let v = term();
      while (peek() && (peek().o === "+" || peek().o === "-")) { const o = toks[i++].o; const w = term(); v = o === "+" ? v + w : v - w; }
      return v;
    }
    function term() {
      let v = unary();
      for (;;) {
        const k = peek();
        if (k && (k.o === "*" || k.o === "/")) { i++; const w = unary(); v = k.o === "*" ? v * w : v / w; }
        else if (startsAtom(k)) v *= power();   // неявное умножение: 2π, 3√2
        else break;
      }
      return v;
    }
    function unary() {
      const k = peek();
      if (k && (k.o === "-" || k.o === "+")) { i++; const v = unary(); return k.o === "-" ? -v : v; }
      return power();
    }
    function power() {
      const b = atom();
      if (peek() && peek().o === "^") { i++; return Math.pow(b, unary()); }
      return b;
    }
    function atom() {
      const k = toks[i++];
      if (!k) throw 0;
      if (k.n !== undefined) return k.n;
      if (k.r) { const v = atom(); return Math.sqrt(v); }
      if (k.o === "(") { const v = expr(); if (!peek() || peek().o !== ")") throw 0; i++; return v; }
      throw 0;
    }
    try { const v = expr(); return i === toks.length ? v : NaN; } catch (e) { return NaN; }
  }
  const toNum = (s) => evalExpr(s);

  /* Угол: число — градусы; с π или «рад» — радианы. Возвращает градусы (или NaN). */
  function parseAngle(raw) {
    let s = String(raw).toLowerCase().replace(/°|град\.?|deg/g, "");
    const rad = /π|pi|рад|rad/.test(s);
    s = s.replace(/рад\.?|rad/g, "");
    const v = evalExpr(s);
    if (!isFinite(v)) return NaN;
    return snap(rad ? v * R2D : v);
  }

  /* Список чисел через пробел или «;» (запятая внутри числа — десятичная; «1,2,3» без пробелов — три числа). */
  function parseList(raw) {
    const s = String(raw).trim();
    if (!s) return { vals: [] };
    let toks;
    if (/[;\s]/.test(s)) toks = s.split(/[;\s]+/);
    else if ((s.match(/,/g) || []).length >= 2) toks = s.split(",");
    else toks = [s];
    toks = toks.map((t) => t.replace(/^,+|,+$/g, "")).filter(Boolean);
    const vals = [];
    for (const t of toks) {
      const v = toNum(t);
      if (!isFinite(v)) return { vals: [], bad: t };
      vals.push(v);
    }
    return { vals };
  }
  const listStr = (a, max) => {
    max = max || 16;
    return a.length > max ? a.slice(0, max).map(fmt).join("; ") + `; … (всего ${a.length})` : a.map(fmt).join("; ");
  };
  const joinT = (arr, sep, max) => {
    max = max || 10;
    return arr.length > max ? arr.slice(0, max).join(sep) + sep + "…" : arr.join(sep);
  };
  const svgWrap = (W, H, label, g) =>
    `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(label)}" style="font:11px var(--mono);fill:var(--muted)">${g}</svg>`;

  /* =====================================================================
     СТЕРЕОМЕТРИЯ: помощники
     ===================================================================== */
  const PI = Math.PI;
  const posN = (v, name) => { if (!(v > 0)) fail(`${name} должно быть больше нуля.`); };
  const polyN = (n) => { if (!isInt(n) || n < 3 || n > 20) fail("n — число сторон основания, целое от 3 до 20."); };
  const clampC = (c) => Math.max(-1, Math.min(1, c));
  const angOf = (c) => Math.acos(clampC(c)) * R2D;
  const dg = (d) => String(Number(snap(d).toFixed(2))).replace("-", "−") + "°";
  const V3 = {
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: (a) => Math.hypot(a[0], a[1], a[2]),
    mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
  };
  const vs = (v) => "(" + v.map((t) => fmt(snap(t))).join("; ") + ")";
  const zero3 = (v) => V3.len(v) < 1e-12;

  /* Правильный n-угольник со стороной a */
  const poly = (n, a) => ({
    R: a / (2 * Math.sin(PI / n)), r: a / (2 * Math.tan(PI / n)), S: (n * a * a) / (4 * Math.tan(PI / n)), P: n * a,
  });

  /* ---------- Рисунки ---------- */
  function pyramidSvg(n, R, H, r) {
    const W = 340, Hh = 250, cx = 170, cy = 190, k = 0.32;
    const sc = Math.min(110 / R, 150 / H, 1e9);
    const Rp = R * sc, Hp = Math.min(H * sc, 160);
    const vx = (i) => cx + Rp * Math.cos(PI / 2 + (2 * PI * i) / n), vy = (i) => cy + Rp * k * Math.sin(PI / 2 + (2 * PI * i) / n);
    const ax = cx, ay = cy - Hp;
    let g = "";
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n, front = vy(i) + vy(j) > 2 * cy;
      g += `<line x1="${vx(i).toFixed(1)}" y1="${vy(i).toFixed(1)}" x2="${vx(j).toFixed(1)}" y2="${vy(j).toFixed(1)}" style="stroke:var(--muted)" stroke-width="1.5" ${front ? "" : 'stroke-dasharray="4 3"'}/>`;
      const fv = vy(i) > cy + 0.5;
      g += `<line x1="${ax}" y1="${ay.toFixed(1)}" x2="${vx(i).toFixed(1)}" y2="${vy(i).toFixed(1)}" style="stroke:var(--accent)" stroke-width="1.5" ${fv ? "" : 'stroke-dasharray="4 3"'}/>`;
    }
    g += `<line x1="${ax}" y1="${ay.toFixed(1)}" x2="${cx}" y2="${cy}" style="stroke:var(--ink)" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="${cx}" cy="${cy}" r="2.5" style="fill:var(--ink)"/>`;
    g += `<text x="${cx + 6}" y="${((ay + cy) / 2).toFixed(1)}" style="fill:var(--ink)">H = ${esc(fmt(H))}</text>`;
    g += `<text x="${cx}" y="${Hh - 6}" text-anchor="middle">правильная ${n}-угольная пирамида</text>`;
    return svgWrap(W, Hh, "Правильная пирамида", g);
  }
  function frustumSvg(Rr, r, H) {
    const W = 340, Hh = 260, cx = 170, k = 0.28, yb = 205;
    const sc = Math.min(120 / Math.max(Rr, r), 150 / H);
    const Rp = Rr * sc, rp = r * sc, Hp = Math.min(150, H * sc), yt = yb - Hp;
    let g = `<ellipse cx="${cx}" cy="${yb}" rx="${Rp.toFixed(1)}" ry="${(Rp * k).toFixed(1)}" style="fill:none;stroke:var(--muted)" stroke-width="1.5"/>`;
    g += `<ellipse cx="${cx}" cy="${yt.toFixed(1)}" rx="${rp.toFixed(1)}" ry="${(rp * k).toFixed(1)}" style="fill:var(--accent-soft);stroke:var(--muted)" stroke-width="1.5"/>`;
    g += `<line x1="${(cx - Rp).toFixed(1)}" y1="${yb}" x2="${(cx - rp).toFixed(1)}" y2="${yt.toFixed(1)}" style="stroke:var(--accent)" stroke-width="2"/><line x1="${(cx + Rp).toFixed(1)}" y1="${yb}" x2="${(cx + rp).toFixed(1)}" y2="${yt.toFixed(1)}" style="stroke:var(--accent)" stroke-width="2"/>`;
    g += `<line x1="${cx}" y1="${yt.toFixed(1)}" x2="${cx}" y2="${yb}" style="stroke:var(--ink)" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="${cx}" y1="${yb}" x2="${(cx + Rp).toFixed(1)}" y2="${yb}" style="stroke:var(--ink)" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="${cx}" y1="${yt.toFixed(1)}" x2="${(cx + rp).toFixed(1)}" y2="${yt.toFixed(1)}" style="stroke:var(--ink)" stroke-width="1.2" stroke-dasharray="3 3"/>`;

  }
  function sphereSvg(R, d) {

      g += `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${yc.toFixed(1)}" style="stroke:var(--ink)" stroke-width="1.2"/><line x1="${cx}" y1="${yc.toFixed(1)}" x2="${(cx + rs).toFixed(1)}" y2="${yc.toFixed(1)}" style="stroke:var(--accent)" stroke-width="1.5"/><line x1="${cx}" y1="${cy}" x2="${(cx + rs).toFixed(1)}" y2="${yc.toFixed(1)}" style="stroke:var(--ink)" stroke-width="1.2" stroke-dasharray="3 3"/>`;

  function solvePrism(x) {
    const { n, a, H } = x;

    const g = poly(n, a), V = g.S * H, Sl = g.P * H, Sf = Sl + 2 * g.S;
    const steps = [
      S("Основание — правильный n-угольник", `r = a / (2·tg(π/n)) = ${fmt(g.r)},  R = a / (2·sin(π/n)) = ${fmt(g.R)}`),
      S("S осн = n·a² / (4·tg(π/n))", `S осн = ${n}·${fmt(a)}² / (4·tg(180°/${n})) = ${fmt(g.S)}`),
      S("P осн = n·a", `P = ${n}·${fmt(a)} = ${fmt(g.P)}`),
      S("V = S осн · H", `V = ${fmt(g.S)}·${fmt(H)} = ${fmt(V)}`),
      S("S бок = P осн · H", `S бок = ${fmt(g.P)}·${fmt(H)} = ${fmt(Sl)}`),
      S("S полн = S бок + 2·S осн", `S полн = ${fmt(Sl)} + 2·${fmt(g.S)} = ${fmt(Sf)}`),
    ];
    const dBase = n % 2 === 0 ? 2 * g.R : g.R + g.r;
    const dSp = Math.hypot(H, dBase);
    steps.push(S("Наибольшая диагональ призмы = √(H² + d²), d — наибольшая диагональ основания", `d = ${fmt(dBase)},  √(${fmt(H)}² + ${fmt(dBase)}²) = ${fmt(dSp)}`));
    steps.push(S("Описанный шар: R_ш = √(R² + (H/2)²)", `√(${fmt(g.R)}² + ${fmt(H / 2)}²) = ${fmt(Math.hypot(g.R, H / 2))}`));
    return { steps, answers: [A("V", V), A("S бок", Sl), A("S полн", Sf), A("S осн", g.S), A("Радиус описанной окружности основания", g.R), A("Радиус вписанной окружности основания", g.r), A("Радиус описанного шара", Math.hypot(g.R, H / 2))] };
  }

  function solveBox(x) {

      S("d = √(a² + b² + c²)", `d = √(${fmt(a)}² + ${fmt(b)}² + ${fmt(c)}²) = ${fmt(d)}`),
      S("V = a·b·c", `V = ${fmt(a)}·${fmt(b)}·${fmt(c)} = ${fmt(V)}`),

      S("Угол диагонали с плоскостью основания: sin φ = c / d", `φ = arcsin(${fmt(c)} / ${fmt(d)}) = ${dg(Math.asin(c / d) * R2D)}`),

  function solvePyramid(x) {
    const { n, a, mode, val } = x;
    polyN(n); posN(a, "Сторона основания a"); posN(val, "Заданная величина");
    const g = poly(n, a);
    let H, why;
    if (mode === "H") { H = val; why = `H = ${fmt(val)}`; }
    else if (mode === "b") { if (val <= g.R) fail(`Боковое ребро должно быть больше R основания = ${fmt(g.R)}.`); H = Math.sqrt(val * val - g.R * g.R); why = `H = √(b² − R²) = √(${fmt(val)}² − ${fmt(g.R)}²) = ${fmt(H)}`; }
    else if (mode === "l") { if (val <= g.r) fail(`Апофема должна быть больше r основания = ${fmt(g.r)}.`); H = Math.sqrt(val * val - g.r * g.r); why = `H = √(l² − r²) = √(${fmt(val)}² − ${fmt(g.r)}²) = ${fmt(H)}`; }
    else if (mode === "alpha") { if (val <= 0 || val >= 90) fail("Угол ребра с основанием — от 0° до 90°."); H = g.R * Math.tan(val * D2R); why = `H = R·tg α = ${fmt(g.R)}·tg(${fmt(val)}°) = ${fmt(H)}`; }
    else { if (val <= 0 || val >= 90) fail("Двугранный угол при основании — от 0° до 90°."); H = g.r * Math.tan(val * D2R); why = `H = r·tg β = ${fmt(g.r)}·tg(${fmt(val)}°) = ${fmt(H)}`; }
    const l = Math.hypot(H, g.r), b = Math.hypot(H, g.R), V = (g.S * H) / 3, Sl = 0.5 * g.P * l, Sf = Sl + g.S;
    const al = Math.atan(H / g.R) * R2D, be = Math.atan(H / g.r) * R2D;
    const Rs = (H * H + g.R * g.R) / (2 * H), rs = (g.r * H) / (g.r + l);
    const steps = [
      S("Основание: r = a/(2·tg(π/n)),  R = a/(2·sin(π/n)),  S осн", `r = ${fmt(g.r)},  R = ${fmt(g.R)},  S осн = ${fmt(g.S)}`),
      S("Высота пирамиды", why),
      S("Апофема l = √(H² + r²)", `l = √(${fmt(H)}² + ${fmt(g.r)}²) = ${fmt(l)}`),
      S("Боковое ребро b = √(H² + R²)", `b = √(${fmt(H)}² + ${fmt(g.R)}²) = ${fmt(b)}`),
      S("V = ⅓·S осн·H", `V = ${fmt(g.S)}·${fmt(H)} / 3 = ${fmt(V)}`),

      S("S полн = S бок + S осн", `S полн = ${fmt(Sl)} + ${fmt(g.S)} = ${fmt(Sf)}`),
      S("Угол бокового ребра с основанием: tg α = H / R", `α = ${dg(al)}`),
      S("Двугранный угол при основании: tg β = H / r", `β = ${dg(be)}`),
      S("Описанный шар: R_ш = (H² + R²) / (2H)", `R_ш = (${fmt(H)}² + ${fmt(g.R)}²) / (2·${fmt(H)}) = ${fmt(Rs)}`),
      S("Вписанный шар: ρ = r·H / (r + l)", `ρ = ${fmt(g.r)}·${fmt(H)} / (${fmt(g.r)} + ${fmt(l)}) = ${fmt(rs)}`),

  function solveFrustumPyr(x) {

  const RP = {

  function solveRegular(x) {

  /* =====================================================================
     2. ТЕЛА ВРАЩЕНИЯ
     ===================================================================== */
  function solveFrustumCone(x) {
    const { R, r, H } = x;
    posN(R, "R"); posN(r, "r"); posN(H, "H");
    const l = Math.hypot(H, R - r), V = (PI * H * (R * R + R * r + r * r)) / 3, Sl = PI * (R + r) * l, Sf = Sl + PI * (R * R + r * r);
    const steps = [
      S("Образующая l = √(H² + (R − r)²)", `l = √(${fmt(H)}² + ${fmt(R - r)}²) = ${fmt(l)}`),
      S("V = πH/3·(R² + R·r + r²)", `V = π·${fmt(H)}/3·(${fmt(R * R)} + ${fmt(R * r)} + ${fmt(r * r)}) = ${fmt(V)}`),
      S("S бок = π(R + r)·l", `S бок = π·${fmt(R + r)}·${fmt(l)} = ${fmt(Sl)}`),
      S("S полн = S бок + πR² + πr²", `S полн = ${fmt(Sl)} + ${fmt(PI * R * R)} + ${fmt(PI * r * r)} = ${fmt(Sf)}`),
    ];
    const ans = [A("l", l), A("V", V), A("S бок", Sl), A("S полн", Sf)];
    if (Math.abs(R - r) > 1e-12) {
      const al = Math.atan(H / Math.abs(R - r)) * R2D;
      steps.push(S("Угол образующей с основанием: tg φ = H / |R − r|", `φ = ${dg(al)}`));
      const H0 = (H * Math.max(R, r)) / Math.abs(R - r);
      steps.push(S("Высота полного конуса H₀ = H·R_большего / |R − r|", `H₀ = ${fmt(H0)}`));
      ans.push(A("Угол образующей с основанием", dg(al)), A("Высота полного конуса", H0));
    } else steps.push(N("R = r — это цилиндр."));
    return { steps, plot: frustumSvg(R, r, H), answers: ans };
  }

  function solveBodySpheres(x) {
    const { body, r, H } = x;
    posN(r, "r"); posN(H, "H");
    const steps = [];
    const ans = [];
    if (body === "cyl") {
      const Rc = Math.hypot(r, H / 2);
      steps.push(S("Описанный шар: R_ш = √(r² + (H/2)²)", `√(${fmt(r)}² + ${fmt(H / 2)}²) = ${fmt(Rc)}`));
      ans.push(A("Радиус описанного шара", Rc));
      if (Math.abs(H - 2 * r) < 1e-9 * Math.max(1, H)) { steps.push(N(`H = 2r — осевое сечение квадрат, шар вписать можно: ρ = r = ${fmt(r)}.`)); ans.push(A("Радиус вписанного шара", r)); }
      else { steps.push(N(`Шар вписывается в цилиндр только при H = 2r (здесь 2r = ${fmt(2 * r)}, H = ${fmt(H)}).`)); ans.push(A("Вписанный шар", "нет")); }
      const V = PI * r * r * H, Sf = 2 * PI * r * (r + H);
      steps.push(S("V = πr²H,  S полн = 2πr(r + H)", `V = ${fmt(V)},  S = ${fmt(Sf)}`));
      ans.push(A("V", V), A("S полн", Sf));
    } else {
      const l = Math.hypot(r, H), Rc = (H * H + r * r) / (2 * H), rho = (r * H) / (r + l);
      steps.push(S("Образующая l = √(r² + H²)", `l = ${fmt(l)}`));
      steps.push(S("Описанный шар: R_ш = (H² + r²) / (2H)", `R_ш = (${fmt(H)}² + ${fmt(r)}²) / (2·${fmt(H)}) = ${fmt(Rc)}`));
      steps.push(S("Вписанный шар: ρ = r·H / (r + l)", `ρ = ${fmt(r)}·${fmt(H)} / (${fmt(r)} + ${fmt(l)}) = ${fmt(rho)}`));
      const V = (PI * r * r * H) / 3, Sf = PI * r * (r + l);
      steps.push(S("V = ⅓πr²H,  S полн = πr(r + l)", `V = ${fmt(V)},  S = ${fmt(Sf)}`));
      steps.push(S("Угол образующей с основанием: tg φ = H / r", `φ = ${dg(Math.atan(H / r) * R2D)}`));
      ans.push(A("l", l), A("Радиус описанного шара", Rc), A("Радиус вписанного шара", rho), A("V", V), A("S полн", Sf));
    }
    return { steps, answers: ans };
  }

  function solveCap(x) {
    const { R, h } = x;
    posN(R, "R"); posN(h, "h");
    if (h > 2 * R + 1e-12) fail(`Высота сегмента h не может быть больше диаметра 2R = ${fmt(2 * R)}.`);
    const a2 = h * (2 * R - h), a = Math.sqrt(Math.max(0, a2));
    const Vs = (PI * h * h * (3 * R - h)) / 3, Sc = 2 * PI * R * h, Sf = Sc + PI * a2, Vsec = (2 * PI * R * R * h) / 3, Ssec = Sc + PI * R * a;
    const steps = [
      S("Радиус основания сегмента: a² = h(2R − h)", `a² = ${fmt(h)}·${fmt(2 * R - h)} = ${fmt(a2)},  a = ${fmt(a)}`),
      S("V сегмента = πh²(3R − h)/3", `V = π·${fmt(h * h)}·${fmt(3 * R - h)}/3 = ${fmt(Vs)}`),
      S("S сферического сегмента (без основания) = 2πRh", `S = 2π·${fmt(R)}·${fmt(h)} = ${fmt(Sc)}`),
      S("S полная поверхность сегмента = 2πRh + πa²", `S = ${fmt(Sf)}`),
      S("V шарового сектора = 2πR²h/3", `V = 2π·${fmt(R * R)}·${fmt(h)}/3 = ${fmt(Vsec)}`),
      S("S полной поверхности сектора = 2πRh + πRa", `S = ${fmt(Ssec)}`),
    ];
    return { steps, plot: sphereSvg(R, R - h), answers: [A("a (радиус основания)", a), A("V сегмента", Vs), A("S сегмента (шапка)", Sc), A("S полная сегмента", Sf), A("V сектора", Vsec), A("S полная сектора", Ssec)] };
  }

  function solveSection(x) {
    const { R, d } = x;
    posN(R, "R");
    if (d < 0) fail("Расстояние d от центра до плоскости — неотрицательное число.");
    const steps = [S("r = √(R² − d²)", d < R ? `r = √(${fmt(R)}² − ${fmt(d)}²) = ${fmt(Math.sqrt(R * R - d * d))}` : "R² − d² ≤ 0")];
    if (d > R + 1e-12) { steps.push(N("d > R: плоскость не пересекает шар.")); return { steps, answers: [A("Сечение", "пусто")] }; }
    if (Math.abs(d - R) < 1e-12) { steps.push(N("d = R: плоскость касается шара в одной точке.")); return { steps, plot: sphereSvg(R, d), answers: [A("Сечение", "точка касания")] }; }
    const r = Math.sqrt(R * R - d * d);
    steps.push(S("S сечения = πr²,  длина окружности = 2πr", `S = ${fmt(PI * r * r)},  L = ${fmt(2 * PI * r)}`));
    steps.push(N(`Большой круг получается при d = 0: r = R = ${fmt(R)}.`));
    return { steps, plot: sphereSvg(R, d), answers: [A("r сечения", r), A("S сечения", PI * r * r), A("Длина окружности сечения", 2 * PI * r), A("V шара", (4 * PI * R ** 3) / 3), A("S сферы", 4 * PI * R * R)] };
  }

  function solveLayer(x) {
    const { R, d1, d2 } = x;
    posN(R, "R");
    if (Math.abs(d1) > R || Math.abs(d2) > R) fail("Плоскости должны пересекать шар: |d| ≤ R.");
    const h = Math.abs(d2 - d1);
    if (h === 0) fail("Плоскости совпадают: толщина слоя равна нулю.");
    const r1 = Math.sqrt(R * R - d1 * d1), r2 = Math.sqrt(R * R - d2 * d2);
    const V = (PI * h * (3 * r1 * r1 + 3 * r2 * r2 + h * h)) / 6, Sl = 2 * PI * R * h, Sf = Sl + PI * (r1 * r1 + r2 * r2);
    const steps = [
      N("d₁ и d₂ — расстояния от центра шара до плоскостей со знаком: по разные стороны от центра числа разных знаков."),
      S("Толщина слоя h = |d₂ − d₁|", `h = |${fmt(d2)} − ${par(d1)}| = ${fmt(h)}`),
      S("Радиусы оснований r = √(R² − d²)", `r₁ = ${fmt(r1)},  r₂ = ${fmt(r2)}`),
      S("V = πh/6·(3r₁² + 3r₂² + h²)", `V = π·${fmt(h)}/6·(${fmt(3 * r1 * r1)} + ${fmt(3 * r2 * r2)} + ${fmt(h * h)}) = ${fmt(V)}`),
      S("S боковая (пояс) = 2πRh", `S = ${fmt(Sl)}`),
      S("S полная = 2πRh + πr₁² + πr₂²", `S = ${fmt(Sf)}`),
    ];
    return { steps, answers: [A("h", h), A("V", V), A("S пояса", Sl), A("S полная", Sf)] };
  }

  /* =====================================================================
     3. КООРДИНАТЫ И ВЕКТОРЫ В ПРОСТРАНСТВЕ
     ===================================================================== */
  function solvePoints(x) {
    const A_ = x.A, B = x.B, v = V3.sub(B, A_), d = V3.len(v), mid = V3.mul(V3.add(A_, B), 0.5);
    const steps = [
      S("Вектор AB = (x₂ − x₁; y₂ − y₁; z₂ − z₁)", `AB = ${vs(v)}`),
      S("|AB| = √(Δx² + Δy² + Δz²)", `|AB| = √(${fmt(v[0] ** 2)} + ${fmt(v[1] ** 2)} + ${fmt(v[2] ** 2)}) = ${fmt(d)}`),
      S("Середина M = ((x₁+x₂)/2; (y₁+y₂)/2; (z₁+z₂)/2)", `M = ${vs(mid)}`),
    ];
    const ans = [A("AB", vs(v)), A("|AB|", d), A("Середина M", vs(mid))];
    if (d > 0) {
      const cs = v.map((t) => t / d);
      steps.push(S("Направляющие косинусы: cos = Δ / |AB|", `cos α = ${fmt(snap(cs[0]))},  cos β = ${fmt(snap(cs[1]))},  cos γ = ${fmt(snap(cs[2]))}`));
      ans.push(A("Углы вектора с осями Ox, Oy, Oz", `${dg(angOf(cs[0]))}; ${dg(angOf(cs[1]))}; ${dg(angOf(cs[2]))}`));
    } else steps.push(N("Точки совпали: вектор нулевой."));
    return { steps, answers: ans };
  }

  function solveVectors(x) {
    const u = x.u, w = x.v;
    const lu = V3.len(u), lw = V3.len(w), dt = V3.dot(u, w), cr = V3.cross(u, w), lc = V3.len(cr);
    const steps = [
      S("|u| и |v|", `|u| = ${fmt(lu)},  |v| = ${fmt(lw)}`),
      S("u·v = x₁x₂ + y₁y₂ + z₁z₂", `u·v = ${par(u[0] * w[0])} + ${par(u[1] * w[1])} + ${par(u[2] * w[2])} = ${fmt(dt)}`),
      S("u × v = (y₁z₂ − z₁y₂; z₁x₂ − x₁z₂; x₁y₂ − y₁x₂)", `u × v = ${vs(cr)}`),
      S("|u × v|", fmt(lc)),
    ];
    const ans = [A("u·v", dt), A("u × v", vs(cr)), A("Площадь параллелограмма |u × v|", lc), A("Площадь треугольника", lc / 2)];
    if (lu > 0 && lw > 0) {
      const c = dt / (lu * lw), ang = angOf(c);
      steps.push(S("cos φ = u·v / (|u|·|v|)", `cos φ = ${fmt(dt)} / (${fmt(lu)}·${fmt(lw)}) = ${fmt(snap(c))},  φ = ${dg(ang)}`));
      steps.push(S("Проекция u на v: (u·v)/|v|", `${fmt(dt / lw)}`));
      steps.push(N(Math.abs(dt) < 1e-9 * lu * lw ? "u·v = 0 — векторы перпендикулярны." : lc < 1e-9 * lu * lw ? "u × v = 0 — векторы коллинеарны." : "Векторы не перпендикулярны и не коллинеарны."));
      ans.push(A("Угол между векторами", dg(ang)), A("Проекция u на v", dt / lw));
    } else steps.push(N("Один из векторов нулевой: угол не определён."));
    ans.unshift(A("|u|", lu), A("|v|", lw));
    return { steps, answers: ans };
  }

  function solvePlane(x) {
    const P1 = x.A, P2 = x.B, P3 = x.C;
    const ab = V3.sub(P2, P1), ac = V3.sub(P3, P1), n = V3.cross(ab, ac), ln = V3.len(n);
    if (ln < 1e-12) fail("Точки лежат на одной прямой — плоскость не определена.");
    const D = -V3.dot(n, P1);
    const steps = [
      S("AB и AC", `AB = ${vs(ab)},  AC = ${vs(ac)}`),
      S("Нормаль n = AB × AC", `n = ${vs(n)}`),
      S("Ax + By + Cz + D = 0, D = −n·A", mn2(`${fmt(n[0])}x ${n[1] < 0 ? "−" : "+"} ${fmt(Math.abs(n[1]))}y ${n[2] < 0 ? "−" : "+"} ${fmt(Math.abs(n[2]))}z ${D < 0 ? "−" : "+"} ${fmt(Math.abs(D))} = 0`)),
      S("Площадь треугольника ABC = |AB × AC| / 2", `${fmt(ln / 2)}`),
    ];
    const eq = `${fmt(n[0])}x ${n[1] < 0 ? "−" : "+"} ${fmt(Math.abs(n[1]))}y ${n[2] < 0 ? "−" : "+"} ${fmt(Math.abs(n[2]))}z ${D < 0 ? "−" : "+"} ${fmt(Math.abs(D))} = 0`;
    const ans = [A("Уравнение плоскости", mn2(eq)), A("Нормаль n", vs(n)), A("S треугольника ABC", ln / 2)];
    if (x.P) {
      const P = x.P, val = V3.dot(n, P) + D, dist = Math.abs(val) / ln;
      steps.push(S("Расстояние: |A·x₀ + B·y₀ + C·z₀ + D| / √(A² + B² + C²)", `|${fmt(val)}| / ${fmt(ln)} = ${fmt(dist)}`));
      const foot = V3.sub(P, V3.mul(n, val / (ln * ln)));
      steps.push(S("Основание перпендикуляра = P − n·(n·P + D)/|n|²", vs(foot)));
      ans.push(A("Расстояние от точки P до плоскости", dist), A("Основание перпендикуляра", vs(foot)));
    }
    return { steps, answers: ans };
  }
  const mn2 = (s) => s.replace(/-/g, "−");

  function solveAngles(x) {
    const { mode } = x, u = x.u, w = x.v;
    const lu = V3.len(u), lw = V3.len(w);
    if (lu === 0 || lw === 0) fail("Векторы не должны быть нулевыми.");
    const dt = V3.dot(u, w), c = Math.abs(dt) / (lu * lw);
    const steps = [S("u·v и длины", `u·v = ${fmt(dt)},  |u| = ${fmt(lu)},  |v| = ${fmt(lw)}`)];
    let ang;
    if (mode === "ll") { ang = angOf(c); steps.push(S("Угол между прямыми: cos φ = |u·v| / (|u|·|v|), u, v — направляющие векторы", `cos φ = ${fmt(snap(c))}  ⇒  φ = ${dg(ang)}`)); }
    else if (mode === "lp") { ang = Math.asin(clampC(c)) * R2D; steps.push(S("Угол между прямой и плоскостью: sin φ = |d·n| / (|d|·|n|), d — направляющий вектор прямой, n — нормаль плоскости", `sin φ = ${fmt(snap(c))}  ⇒  φ = ${dg(ang)}`)); }
    else { ang = angOf(c); steps.push(S("Угол между плоскостями: cos φ = |n₁·n₂| / (|n₁|·|n₂|), n₁, n₂ — нормали", `cos φ = ${fmt(snap(c))}  ⇒  φ = ${dg(ang)}`)); }
    steps.push(N("Эти углы всегда от 0° до 90°."));
    return { steps, answers: [A("Угол φ", dg(ang))] };
  }

  function solveTetra(x) {
    const P1 = x.A, P2 = x.B, P3 = x.C, P4 = x.D;
    const ab = V3.sub(P2, P1), ac = V3.sub(P3, P1), ad = V3.sub(P4, P1);
    const triple = V3.dot(ab, V3.cross(ac, ad)), V = Math.abs(triple) / 6, Sb = V3.len(V3.cross(ab, ac)) / 2;
    const steps = [
      S("AB, AC, AD", `AB = ${vs(ab)},  AC = ${vs(ac)},  AD = ${vs(ad)}`),
      S("Смешанное произведение AB·(AC × AD)", fmt(triple)),
      S("V пирамиды = |смешанное| / 6", `V = ${fmt(Math.abs(triple))} / 6 = ${fmt(V)}`),
      S("S основания ABC = |AB × AC| / 2", fmt(Sb)),
    ];
    const ans = [A("V пирамиды ABCD", V), A("V параллелепипеда на AB, AC, AD", Math.abs(triple)), A("S ABC", Sb)];
    if (Sb > 1e-12) { const h = (3 * V) / Sb; steps.push(S("Высота из D = 3V / S", `h = 3·${fmt(V)} / ${fmt(Sb)} = ${fmt(h)}`)); ans.push(A("Высота из вершины D", h)); }
    else steps.push(N("Точки A, B, C лежат на одной прямой: основание вырождено."));
    if (V < 1e-12) steps.push(N("V = 0: все четыре точки лежат в одной плоскости."));
    const cen = V3.mul(V3.add(V3.add(P1, P2), V3.add(P3, P4)), 0.25);
    steps.push(S("Центр масс (среднее четырёх вершин)", vs(cen)));
    ans.push(A("Центр масс", vs(cen)));
    return { steps, answers: ans };
  }

  function solveSkew(x) {
    const P1 = x.A, d1 = x.u, P2 = x.B, d2 = x.v;
    if (zero3(d1) || zero3(d2)) fail("Направляющие векторы не должны быть нулевыми.");
    const cr = V3.cross(d1, d2), lc = V3.len(cr), w = V3.sub(P2, P1);
    const steps = [S("P₁P₂", `P₁P₂ = ${vs(w)}`), S("d₁ × d₂", `${vs(cr)},  |d₁ × d₂| = ${fmt(lc)}`)];
    let dist;
    if (lc < 1e-9 * V3.len(d1) * V3.len(d2)) {
      dist = V3.len(V3.cross(w, d1)) / V3.len(d1);
      steps.push(N("d₁ × d₂ = 0: прямые параллельны (или совпадают)."));
      steps.push(S("Расстояние между параллельными: |P₁P₂ × d₁| / |d₁|", fmt(dist)));
    } else {
      const trip = V3.dot(w, cr);
      dist = Math.abs(trip) / lc;
      steps.push(S("Смешанное произведение P₁P₂·(d₁ × d₂)", fmt(trip)));
      steps.push(S("Расстояние между скрещивающимися: |P₁P₂·(d₁ × d₂)| / |d₁ × d₂|", `|${fmt(trip)}| / ${fmt(lc)} = ${fmt(dist)}`));
      if (dist < 1e-9) steps.push(N("Расстояние 0: прямые пересекаются."));
    }
    return { steps, answers: [A("Расстояние", dist)] };
  }

  /* ---------- Каталог задач ---------- */

      fields: [fl("R", "R", "радиус шара", ""), fl("d1", "d₁", "положение первой плоскости", ""), fl("d2", "d₂", "положение второй плоскости", "")], ex: { R: "5", d1: "-1", d2: "3" }, solve: solveLayer },

    });
  }

  function renderForm() {
    const t = task(), form = $("form");
    form.innerHTML = "";
    const hint = document.createElement("p"); hint.className = "hint"; hint.textContent = t.hint; form.appendChild(hint);
    t.fields.forEach((f) => {
      const wrap = document.createElement("div"); wrap.className = "field";
      const lab = document.createElement("label"); lab.htmlFor = "f-" + f.id;
      lab.innerHTML = (f.sym ? `<b>${esc(f.sym)}</b>` : "") + esc(f.label);
      const box = document.createElement("div"); box.className = "inp";
      let inp;
      if (f.select) {
        inp = document.createElement("select");
        f.select.forEach(([v, l]) => inp.add(new Option(l, v)));
      } else {
        inp = document.createElement("input"); inp.type = "text";
        inp.inputMode = "text";
        inp.autocapitalize = "off"; inp.autocomplete = "off"; inp.spellcheck = false;
        inp.placeholder = f.ph || (f.opt ? "необязательно" : (f.def !== undefined ? String(f.def) : ""));
      }
      inp.id = "f-" + f.id;
      inp.addEventListener("input", () => { showExampleNote = false; solve(); });
      inp.addEventListener("change", () => { showExampleNote = false; solve(); });
      box.appendChild(inp);
      if (f.unit) { const u = document.createElement("span"); u.className = "u"; u.textContent = f.unit; box.appendChild(u); }
      wrap.append(lab, box); form.appendChild(wrap);
    });
    const ex = t.ex || {};
    t.fields.forEach((f) => { if (ex[f.id] !== undefined) $("f-" + f.id).value = ex[f.id]; });
  }

  function collect() {
    const t = task(), x = {}, given = [], missing = [];
    for (const f of t.fields) {
      const el = $("f-" + f.id); const raw = el.value.trim();
      const name = f.sym || f.label;
      if (f.select) { x[f.id] = raw; continue; }
      if (raw === "") {
        if (f.def !== undefined) { x[f.id] = f.def; continue; }
        x[f.id] = null; if (!f.opt) missing.push(name); continue;
      }
      if (f.text) { x[f.id] = raw; given.push(A(name, raw, f.unit)); continue; }
      if (f.list || f.vec) {
        const r = parseList(raw);
        if (r.bad !== undefined) throw new Error(`Поле «${name}»: не удалось прочитать «${r.bad}». Введите числа через пробел.`);
        if (f.vec && r.vals.length !== 3) throw new Error(`Поле «${name}»: нужно ровно три числа (x y z), сейчас ${r.vals.length}.`);
        x[f.id] = r.vals; given.push(A(name, f.vec ? "(" + r.vals.map(fmt).join("; ") + ")" : listStr(r.vals), f.unit)); continue;
      }
      if (f.ang) {
        const d = parseAngle(raw);
        if (!isFinite(d)) throw new Error(`Поле «${name}»: введите угол — число (градусы) или с π (радианы), например 30, 5π/6, 1,2 рад.`);
        x[f.id] = d; x[f.id + "_raw"] = raw; given.push(A(name, d, "°")); continue;
      }
      const n = toNum(raw);
      if (!isFinite(n)) throw new Error(`Поле «${name}»: введите число.`);
      x[f.id] = n; given.push(A(name, /[√π\/^]|sqrt|pi/i.test(raw) ? `${raw} ≈ ${fmt(n)}` : n, f.unit));
    }
    if (missing.length) { const e = new Error("Заполните: " + missing.join(", ") + "."); e.soft = true; throw e; }
    return { x, given };
  }

  let lastText = "";
  function solve() {
    const paper = $("paper"), t = task();
    let out, given;
    try {
      const c = collect(); given = c.given;
      out = t.solve(c.x);
    } catch (e) {
      paper.innerHTML = `<p class="msg${e.soft ? "" : " err"}">${html(e.message)}</p>`;
      lastText = ""; return;
    }
    const line = (a) => `${a[0]} = ${typeof a[1] === "number" ? fmt(a[1]) : a[1]}${a[2] ? " " + a[2] : ""}`;
    let h = "";
    if (showExampleNote) h += `<p class="note">Подставлен пример. Измените числа слева, решение пересчитается.</p>`;
    if (given.length) {
      h += `<div><h2>Дано</h2><div class="given">${given.map((a) => `<span>${html(a[0])} = ${html(fmt(a[1]))} <em>${html(a[2])}</em></span>`).join("")}</div></div>`;
    }
    h += `<div><h2>Решение</h2>${out.steps.map((s) => s.t ? `<div class="step t">${html(s.t)}</div>` : `<div class="step"><div class="f">${html(s.f)}</div><div class="c">${html(s.c)}</div></div>`).join("")}</div>`;
    if (out.plot) h += `<div class="plot">${out.plot}</div>`;
    h += `<div><h2>Ответ</h2><div class="answer">${out.answers.map((a) => `<div>${html(a[0])} = ${html(typeof a[1] === "number" ? fmt(a[1]) : a[1])} <small>${html(a[2])}</small></div>`).join("")}</div></div>`;
    h += `<div class="actions"><button type="button" id="copy">Копировать решение</button><span id="copied"></span></div>`;
    paper.innerHTML = h;
    lastText = [t.title, "", "Дано:", ...given.map(line), "", "Решение:", ...out.steps.map((s) => (s.t ? s.t : s.f + "\n" + s.c)), "", "Ответ:", ...out.answers.map(line)].join("\n");
    $("copy").onclick = copy;
  }
  function copy() {
    const done = (m) => { $("copied").textContent = m; setTimeout(() => { const c = $("copied"); if (c) c.textContent = ""; }, 2000); };
    const fallback = () => {
      const ta = document.createElement("textarea"); ta.value = lastText; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove(); done(ok ? "Скопировано" : "Не удалось скопировать");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(lastText).then(() => done("Скопировано"), fallback);
    else fallback();
  }

  function selectTask(id) {
    state.id = id; state.cat = task().cat; showExampleNote = true; save();
    renderNav(); renderForm(); solve();
  }
  $("form").addEventListener("submit", (e) => e.preventDefault());
  renderNav(); renderForm(); solve();
})();
</script>

<style>
  .ios-hint {
    position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom, 0px));
    z-index: 50; display: none; align-items: flex-start; gap: 12px;
    max-width: 480px; margin: 0 auto; padding: 12px 14px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,.18); font-size: 14px; line-height: 1.4;
  }
  .ios-hint.show { display: flex; }
  .ios-hint b { font-weight: 600; }
  .ios-hint button {
    margin-left: auto; flex: none; min-width: 44px; min-height: 44px; margin-block: -8px -8px;
    border: 0; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer;
  }
</style>
<div class="ios-hint" id="iosHint" role="note">
  <div><b>Установить на iPhone:</b> нажмите «Поделиться»
    <span aria-hidden="true">&#x2191;&#xFE0E;</span> в Safari и выберите «На экран “Домой”».</div>
  <button type="button" id="iosHintClose" aria-label="Закрыть подсказку">&times;</button>
</div>
<script>
(function () {
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw-stereometry.js").catch(function () {});
    });
  }
  try {
    var ua = navigator.userAgent || "";
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    var seen = false;
    try { seen = localStorage.getItem("iosHintSeenStereometry") === "1"; } catch (e) {}
    var hint = document.getElementById("iosHint");
    if (isIOS && !standalone && !seen && hint) {
      hint.classList.add("show");
      document.getElementById("iosHintClose").onclick = function () {
        hint.classList.remove("show");
        try { localStorage.setItem("iosHintSeenStereometry", "1"); } catch (e) {}
      };
    }
  } catch (e) {}
})();
</script>
