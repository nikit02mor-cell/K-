plugins {
    id 'com.android.application'
}

android {
    namespace 'com.physicssolver.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.physicssolver.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    // Страницы приложения берём прямо из docs/, чтобы сайт и APK не расходились.
    sourceSets {
        main {
            assets.srcDirs = ['../docs']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
}
